<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Auth - KarasuBerry</title>
  <style>:root{--bg:#080006;--card:#16000c;--red:#c8141e;--white:#f5eeea;--ff-body:'Outfit',sans-serif}body{background:var(--bg);color:var(--white);font-family:var(--ff-body);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}.auth-form{background:var(--card);padding:2rem;border-radius:0.5rem;max-width:400px;width:100%;text-align:center}input,button{width:100%;padding:0.75rem;margin:0.5rem 0;border:1px solid #333;border-radius:0.25rem}button{background:var(--red);color:var(--white);border:none;cursor:pointer}button:hover{background:#e8303a}#qrCode{max-width:200px;margin-top:1rem}</style>
</head>
<body>
  <div class="auth-form">
    <h2>Login / Register</h2>
    <input type="tel" id="phone" placeholder="Phone (e.g., +919816157745)" required>
    <button onclick="sendOTP()">Send OTP</button>
    <input type="text" id="otp" placeholder="Enter OTP">
    <input type="password" id="password" placeholder="Password">
    <button onclick="login()">Login</button>
    <button onclick="setup2FA()">Setup 2FA</button>
    <img id="qrCode" style="display:none">
  </div>
  <script type="module">
    import { apiCall } from './api.js';
    // Paste full auth.js code here (sendOTP, verifyOTP, login, setup2FA)
  </script>
</body>
</html>
