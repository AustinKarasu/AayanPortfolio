<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StudyArea · KarasuBerry</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
/* ─── TOKENS ──────────────────────────────────────────────────────────────── */
:root{
  --bg:#080006;--bg2:#0e000a;--card:#16000c;--surface:#120008;
  --border:rgba(255,255,255,0.07);--border-hot:rgba(200,20,40,0.4);
  --red:#c8141e;--red2:#e8303a;--gold:#c9a84c;--gold2:#e8c97a;
  --white:#f5eeea;--muted:#5a4a50;--text:#b8a8ad;
  --glow-r:0 0 60px rgba(200,20,40,.3);
  --ff-d:'Bebas Neue',sans-serif;
  --ff-b:'Outfit',sans-serif;
  --ff-m:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.23,1,.32,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--ff-b);overflow-x:hidden;-webkit-font-smoothing:antialiased;min-height:100vh}
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--red);border-radius:3px}

/* ─── AMBIENT ─────────────────────────────────────────────────────────────── */
.ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.amb-orb{position:absolute;border-radius:50%;filter:blur(110px)}
.amb-orb:nth-child(1){width:600px;height:600px;top:-15%;left:-8%;background:radial-gradient(circle,rgba(180,10,20,.13),transparent 70%);animation:drift 22s ease-in-out infinite alternate}
.amb-orb:nth-child(2){width:500px;height:500px;bottom:-10%;right:-8%;background:radial-gradient(circle,rgba(160,8,16,.09),transparent 70%);animation:drift 28s ease-in-out infinite alternate-reverse}
@keyframes drift{0%{transform:translate(0,0)}100%{transform:translate(45px,35px)}}
.ambient::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(200,20,40,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(200,20,40,.028) 1px,transparent 1px);background-size:80px 80px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,#000 10%,transparent 100%)}

/* ─── LAYOUT ──────────────────────────────────────────────────────────────── */
.wrap{position:relative;z-index:2}
.container{width:min(1200px,92%);margin:0 auto}

/* ─── NAV ─────────────────────────────────────────────────────────────────── */
nav{padding:20px 0;border-bottom:1px solid var(--border);background:rgba(8,0,6,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);position:sticky;top:0;z-index:200}
.nav-inner{display:flex;align-items:center;justify-content:space-between;gap:16px}
.nav-logo{font-family:var(--ff-d);font-size:1.5rem;letter-spacing:.06em;background:linear-gradient(90deg,#fff 20%,var(--red2) 80%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;text-decoration:none}
.nav-back{font-family:var(--ff-m);font-size:.58rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:color .2s;display:flex;align-items:center;gap:7px}
.nav-back:hover{color:var(--white)}

/* ─── PAGE HEADER ─────────────────────────────────────────────────────────── */
.page-header{padding:clamp(50px,9vw,110px) 0 clamp(36px,5vw,60px);text-align:center}
.page-eyebrow{font-family:var(--ff-m);font-size:.6rem;color:var(--red2);letter-spacing:.25em;text-transform:uppercase;margin-bottom:14px}
.page-title{font-family:var(--ff-d);font-size:clamp(2.8rem,7.5vw,6.5rem);line-height:.92;color:var(--white);letter-spacing:.03em}
.page-title em{font-style:normal;color:var(--red2)}
.page-title span{color:var(--gold)}
.page-rule{width:50px;height:1px;background:linear-gradient(90deg,var(--red),var(--gold));margin:22px auto 0}
.page-sub{font-family:var(--ff-m);font-size:.6rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:16px}

/* ─── CONTROLS ────────────────────────────────────────────────────────────── */
.controls{display:flex;align-items:center;gap:10px;margin-bottom:clamp(36px,5vw,56px);flex-wrap:wrap}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.8rem;pointer-events:none}
#search{width:100%;padding:11px 12px 11px 34px;background:var(--card);border:1px solid var(--border);border-radius:3px;color:var(--white);font-family:var(--ff-m);font-size:.65rem;letter-spacing:.06em;outline:none;transition:border-color .2s}
#search:focus{border-color:var(--border-hot)}
#search::placeholder{color:var(--muted)}
.filters{display:flex;gap:7px;flex-wrap:wrap}
.f-btn{font-family:var(--ff-m);font-size:.56rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--border);background:var(--card);border-radius:2px;cursor:pointer;transition:color .2s,border-color .2s,background .2s}
.f-btn:hover,.f-btn.active{color:var(--white);border-color:var(--border-hot);background:rgba(200,20,40,.08)}

/* ─── BOOK GRID ───────────────────────────────────────────────────────────── */
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:clamp(18px,2.5vw,28px);padding-bottom:clamp(60px,8vw,100px)}
.book-card{opacity:0;transform:translateY(22px);transition:opacity .55s var(--ease),transform .55s var(--ease);cursor:pointer;outline:none}
.book-card.visible{opacity:1;transform:translateY(0)}
.book-cover{background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;transition:border-color .3s,box-shadow .3s,transform .35s var(--ease);position:relative}
.book-cover::before{content:'';position:absolute;top:0;bottom:0;left:0;width:7px;background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(200,20,40,.12) 70%,transparent);z-index:3;border-radius:6px 0 0 6px;pointer-events:none}
.book-card:hover .book-cover,.book-card:focus-visible .book-cover{border-color:var(--border-hot);box-shadow:var(--glow-r),-5px 10px 28px rgba(0,0,0,.55);transform:translateY(-5px) rotate(-0.4deg)}
.book-img{height:190px;overflow:hidden;position:relative;background:var(--surface)}
.book-img img{width:100%;height:100%;object-fit:cover;filter:saturate(.55) brightness(.7);transition:filter .5s,transform .5s var(--ease)}
.book-card:hover .book-img img{filter:saturate(1) brightness(.9);transform:scale(1.06)}
.book-img-ov{position:absolute;inset:0;background:linear-gradient(to top,var(--card) 0%,rgba(22,0,12,.35) 60%,transparent 100%)}
.book-num{position:absolute;top:12px;right:12px;font-family:var(--ff-d);font-size:2.4rem;color:rgba(255,255,255,.055);line-height:1;pointer-events:none;user-select:none;z-index:2}
.book-body{padding:18px 20px 20px}
.book-tag{font-family:var(--ff-m);font-size:.52rem;color:var(--red2);letter-spacing:.14em;text-transform:uppercase;margin-bottom:7px}
.book-title{font-family:var(--ff-d);font-size:1.4rem;color:var(--white);line-height:1.05;letter-spacing:.03em;margin-bottom:6px}
.book-excerpt{font-size:.82rem;line-height:1.55;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:10px}
.book-ch-count{font-family:var(--ff-m);font-size:.5rem;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px}
.book-ch-count span{color:var(--gold)}
.book-foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border)}
.book-meta{font-family:var(--ff-m);font-size:.5rem;color:var(--muted);letter-spacing:.07em;text-transform:uppercase}
.book-cta{font-family:var(--ff-m);font-size:.52rem;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:5px;transition:color .2s}
.book-cta::after{content:'⊕'}
.book-card:hover .book-cta{color:var(--white)}

/* ─── STATES ──────────────────────────────────────────────────────────────── */
.loading{text-align:center;padding:80px 20px}
.loading p{font-family:var(--ff-m);font-size:.62rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}
.empty{text-align:center;padding:80px 20px;display:none}
.empty-ico{font-size:3rem;margin-bottom:12px}
.empty p{font-family:var(--ff-m);font-size:.65rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

/* ═══════════════════════════════════════════════════════════════════════════ */
/*  MODAL                                                                      */
/* ═══════════════════════════════════════════════════════════════════════════ */
#modal{
  position:fixed;inset:0;z-index:1000;
  background:rgba(4,0,3,.94);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:none;align-items:center;justify-content:center;
  padding:16px;
  overflow:hidden; /* never scroll the backdrop */
}
#modal.open{display:flex}

/* the book spread — fixed height, children scroll inside */
.spread{
  width:min(1100px,98%);
  height:min(88vh,740px);
  display:grid;
  grid-template-columns:260px 1fr;
  border-radius:8px;
  border:1px solid var(--border-hot);
  box-shadow:0 0 120px rgba(200,20,40,.22),0 40px 80px rgba(0,0,0,.75);
  overflow:hidden;
  animation:spreadOpen .45s var(--ease) both;
}
@keyframes spreadOpen{
  from{opacity:0;transform:perspective(1400px) rotateY(-12deg) scale(.93)}
  to{opacity:1;transform:none}
}

/* ── LEFT PAGE ───────────────────────────────────────────────────────────── */
.left-page{
  background:var(--surface);
  border-right:2px solid rgba(200,20,40,.18);
  display:flex;
  flex-direction:column;
  overflow:hidden; /* clip image + allow inner list to scroll */
  position:relative;
  flex-shrink:0;
}
.left-page::after{content:'';position:absolute;top:0;bottom:0;right:0;width:10px;background:linear-gradient(270deg,rgba(0,0,0,.4),transparent);pointer-events:none;z-index:5}

.left-cover-img{width:100%;height:150px;object-fit:cover;filter:saturate(.6) brightness(.6);flex-shrink:0;display:block}
.left-img-ov{position:absolute;top:0;left:0;right:0;height:150px;background:linear-gradient(to bottom,transparent 30%,var(--surface) 100%);pointer-events:none;z-index:2}

.left-info{padding:14px 16px 10px;flex-shrink:0;position:relative;z-index:3}
.left-tag{font-family:var(--ff-m);font-size:.5rem;color:var(--red2);letter-spacing:.14em;text-transform:uppercase;margin-bottom:4px}
.left-title{font-family:var(--ff-d);font-size:1.35rem;color:var(--white);line-height:1.05;letter-spacing:.03em;margin-bottom:10px}
.left-divider{height:1px;background:var(--border)}

.ch-label{font-family:var(--ff-m);font-size:.46rem;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;padding:9px 16px 5px;flex-shrink:0}

/* ★ key: this scrolls independently */
.chapter-list{
  flex:1;
  min-height:0;          /* allow flex child to shrink below content */
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  padding-bottom:12px;
}
.ch-item{
  display:flex;align-items:flex-start;gap:9px;
  padding:9px 16px;
  cursor:pointer;
  transition:background .18s;
  border-left:2px solid transparent;
  margin:1px 0;
}
.ch-item:hover{background:rgba(200,20,40,.07)}
.ch-item.active{border-left-color:var(--red2);background:rgba(200,20,40,.1)}
.ch-item.active .ch-num{color:var(--red2)}
.ch-item.active .ch-name{color:var(--white)}
.ch-num{font-family:var(--ff-m);font-size:.48rem;color:var(--muted);letter-spacing:.06em;flex-shrink:0;padding-top:2px;min-width:20px}
.ch-name{font-family:var(--ff-b);font-size:.78rem;color:var(--text);line-height:1.35;font-weight:500}

.left-meta{padding:10px 16px;border-top:1px solid var(--border);flex-shrink:0}
.left-meta p{font-family:var(--ff-m);font-size:.48rem;color:var(--muted);letter-spacing:.07em;text-transform:uppercase;line-height:2.1}
.left-meta span{color:var(--text)}

/* ── RIGHT PAGE ──────────────────────────────────────────────────────────── */
.right-page{
  background:#0c0008;
  display:flex;
  flex-direction:column;
  overflow:hidden; /* children scroll */
  min-width:0;
}

.right-header{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:0 24px;height:50px;
  border-bottom:1px solid var(--border);
  background:#0c0008;
  flex-shrink:0;
  z-index:10;
}
.right-header-title{font-family:var(--ff-m);font-size:.58rem;color:var(--text);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.right-header-actions{display:flex;align-items:center;gap:7px;flex-shrink:0}
.hdr-btn{background:none;border:1px solid var(--border);border-radius:2px;cursor:pointer;font-family:var(--ff-m);font-size:.52rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;padding:5px 10px;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:4px;text-decoration:none}
.hdr-btn:hover{color:var(--gold);border-color:rgba(201,168,76,.3)}
.close-btn{background:none;border:none;cursor:pointer;color:var(--muted);font-size:1.3rem;line-height:1;padding:4px 6px;transition:color .2s;flex-shrink:0}
.close-btn:hover{color:var(--red2)}

/* ★ THE SCROLL FIX — flex:1 + min-height:0 + overflow-y:auto */
.right-content{
  flex:1;
  min-height:0;
  overflow-y:auto;
  overflow-x:hidden;
  padding:28px 32px 44px;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

/* prev / next bar */
.ch-nav{
  display:flex;gap:8px;align-items:center;justify-content:space-between;
  padding:12px 24px;border-top:1px solid var(--border);
  background:#0c0008;flex-shrink:0;
}
.ch-nav-btn{font-family:var(--ff-m);font-size:.54rem;color:var(--muted);letter-spacing:.09em;text-transform:uppercase;background:none;border:1px solid var(--border);border-radius:2px;cursor:pointer;padding:7px 13px;transition:color .2s,border-color .2s;display:flex;align-items:center;gap:5px}
.ch-nav-btn:hover:not(:disabled){color:var(--gold);border-color:rgba(201,168,76,.35)}
.ch-nav-btn:disabled{opacity:.28;cursor:not-allowed}
.ch-nav-btn.prev::before{content:'←';margin-right:2px}
.ch-nav-btn.next::after{content:'→';margin-left:2px}
.ch-nav-info{font-family:var(--ff-m);font-size:.48rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;text-align:center;flex:1}

/* pdf bar */
.pdf-bar{padding:10px 24px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;background:#080005;flex-shrink:0}
.pdf-label{font-family:var(--ff-m);font-size:.48rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.pdf-btn{font-family:var(--ff-m);font-size:.56rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;padding:7px 14px;border:1px solid rgba(201,168,76,.28);border-radius:2px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.pdf-btn::after{content:'↓'}
.pdf-btn:hover{background:rgba(201,168,76,.1);border-color:var(--gold);color:var(--white)}

/* ─── CONTENT TYPOGRAPHY ──────────────────────────────────────────────────── */
.right-content h1{font-family:var(--ff-d);font-size:2.1rem;color:var(--red2);letter-spacing:.03em;line-height:1;margin-bottom:14px}
.right-content h2{font-family:var(--ff-d);font-size:1.55rem;color:var(--white);letter-spacing:.03em;line-height:1.05;margin:26px 0 11px;border-left:3px solid var(--red);padding-left:12px}
.right-content h3{font-family:var(--ff-d);font-size:1.1rem;color:var(--gold);letter-spacing:.03em;margin:18px 0 9px}
.right-content p{font-size:.91rem;line-height:1.82;color:var(--text);margin-bottom:13px}
.right-content ul,.right-content ol{padding-left:20px;margin-bottom:13px}
.right-content li{font-size:.88rem;line-height:1.7;margin-bottom:6px}
.right-content strong{color:var(--white);font-weight:600}
.right-content em{color:var(--gold2);font-style:italic}
.right-content code{font-family:var(--ff-m);font-size:.76rem;background:rgba(200,20,40,.13);color:var(--red2);padding:2px 6px;border-radius:3px}
.right-content pre{background:rgba(0,0,0,.45);border:1px solid var(--border);border-radius:4px;padding:16px 18px;overflow-x:auto;margin-bottom:14px}
.right-content pre code{background:none;color:var(--text);padding:0;font-size:.74rem;line-height:1.75;border-radius:0}
.right-content blockquote{border-left:2px solid var(--gold);padding:9px 15px;background:rgba(201,168,76,.05);border-radius:0 4px 4px 0;margin:14px 0;font-style:italic;color:var(--gold2);font-size:.88rem}
.right-content table{width:100%;border-collapse:collapse;margin-bottom:14px;font-size:.82rem}
.right-content th{background:rgba(200,20,40,.12);color:var(--white);font-family:var(--ff-m);font-size:.54rem;letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;text-align:left;border-bottom:1px solid var(--border-hot)}
.right-content td{padding:8px 12px;border-bottom:1px solid var(--border);color:var(--text)}
.right-content tr:last-child td{border-bottom:none}
.right-content hr{border:none;border-top:1px solid var(--border);margin:24px 0}
.right-content a{color:var(--red2);text-underline-offset:3px}
.right-content a:hover{color:var(--white)}
.right-content .note{background:rgba(201,168,76,.07);border:1px solid rgba(201,168,76,.2);border-radius:4px;padding:12px 14px;margin:13px 0;font-size:.85rem}
.right-content .note::before{content:'📝 Note';display:block;font-family:var(--ff-m);font-size:.5rem;color:var(--gold);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}
.right-content .warning{background:rgba(200,20,40,.07);border:1px solid var(--border-hot);border-radius:4px;padding:12px 14px;margin:13px 0;font-size:.85rem}
.right-content .warning::before{content:'⚠ Warning';display:block;font-family:var(--ff-m);font-size:.5rem;color:var(--red2);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px}

/* ─── MOBILE ──────────────────────────────────────────────────────────────── */
@media(max-width:680px){
  .spread{
    grid-template-columns:1fr;
    grid-template-rows:auto 1fr;
    height:95svh;
  }
  .left-page{
    max-height:190px;
    flex-direction:row;
    border-right:none;
    border-bottom:1px solid var(--border);
    overflow:hidden;
  }
  .left-page::after{display:none}
  .left-cover-img{width:80px;height:100%;flex-shrink:0}
  .left-img-ov{height:100%;width:80px}
  .left-info{padding:10px 12px 10px;flex:1;min-width:0}
  .left-title{font-size:1rem}
  .left-divider,.left-meta,.ch-label{display:none}
  .chapter-list{
    position:absolute;top:0;left:0;right:0;bottom:0;
    display:flex;flex-direction:row;
    overflow-x:auto;overflow-y:hidden;
    align-items:center;
    padding:0 80px;
    background:rgba(12,0,8,.95);
  }
  .left-page{position:relative;overflow:hidden}
  .ch-item{flex-direction:column;gap:2px;padding:8px 12px;border-left:none;border-bottom:2px solid transparent;white-space:nowrap;flex-shrink:0;margin:0 2px}
  .ch-item.active{border-bottom-color:var(--red2);background:rgba(200,20,40,.1)}
  .right-content{padding:18px 16px 36px}
}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true">
  <div class="amb-orb"></div><div class="amb-orb"></div>
</div>

<div class="wrap">
  <nav>
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">KarasuBerry</a>
      <a href="index.html" class="nav-back">← Back to Home</a>
    </div>
  </nav>

  <header class="page-header">
    <div class="container">
      <p class="page-eyebrow">Knowledge Base</p>
      <h1 class="page-title">STUDY<em>AREA</em><br><span>NOTES &amp; RESOURCES</span></h1>
      <div class="page-rule"></div>
      <p class="page-sub">Click any book · Navigate chapters · Read freely</p>
    </div>
  </header>

  <main class="container">
    <div class="controls">
      <div class="search-wrap">
        <span class="search-ico">⌕</span>
        <input type="text" id="search" placeholder="Search titles, topics, chapters…" autocomplete="off"/>
      </div>
      <div class="filters" id="filters">
        <button class="f-btn active" data-filter="all">All</button>
      </div>
    </div>
    <div class="loading" id="loading"><p>Loading books…</p></div>
    <div class="books-grid" id="grid"></div>
    <div class="empty" id="empty">
      <div class="empty-ico">📚</div>
      <p>No notes found — try a different search</p>
    </div>
  </main>
</div>

<!-- ═══ MODAL ════════════════════════════════════════════════════════════════ -->
<div id="modal" role="dialog" aria-modal="true" aria-label="Study book">
  <div class="spread" id="spread">

    <!-- LEFT PAGE: cover image + chapter list -->
    <div class="left-page" id="leftPage">
      <img id="leftImg" src="" alt="" class="left-cover-img" onerror="this.style.display='none'"/>
      <div class="left-img-ov"></div>
      <div class="left-info">
        <p class="left-tag" id="leftTag"></p>
        <h2 class="left-title" id="leftTitle"></h2>
        <div class="left-divider"></div>
      </div>
      <p class="ch-label">Chapters</p>
      <div class="chapter-list" id="chapterList"></div>
      <div class="left-meta" id="leftMeta"></div>
    </div>

    <!-- RIGHT PAGE: header + scrollable content + nav + pdf -->
    <div class="right-page">
      <div class="right-header">
        <span class="right-header-title" id="rightTitle">—</span>
        <div class="right-header-actions">
          <a id="pdfTopBtn" href="#" class="hdr-btn" download>↓ PDF</a>
          <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
        </div>
      </div>

      <div class="right-content" id="rightContent"></div>

      <div class="ch-nav">
        <button class="ch-nav-btn prev" id="prevBtn">Prev</button>
        <span class="ch-nav-info" id="chNavInfo"></span>
        <button class="ch-nav-btn next" id="nextBtn">Next</button>
      </div>

      <div class="pdf-bar">
        <span class="pdf-label">Download full notes as</span>
        <a id="pdfBtn" href="#" class="pdf-btn" download>PDF</a>
      </div>
    </div>

  </div>
</div>

<script>
/* ─── STATE ─────────────────────────────────────────────── */
let ALL = [], current = null, chIdx = 0;
let activeFilter = 'all', searchQ = '';

/* ─── FETCH DATA ─────────────────────────────────────────── */
async function loadBooks() {
  try {
    const r = await fetch('books.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    ALL = await r.json();
    document.getElementById('loading').style.display = 'none';
    buildFilters();
    renderGrid(ALL);
  } catch(e) {
    document.getElementById('loading').innerHTML =
      '<p style="color:var(--red2)">⚠ Could not load books.json — place it in the same folder.</p>';
    console.error(e);
  }
}

/* ─── FILTERS ────────────────────────────────────────────── */
function buildFilters() {
  const tags = [...new Set(ALL.map(b => b.tag))];
  const wrap = document.getElementById('filters');
  tags.forEach(tag => {
    const b = document.createElement('button');
    b.className = 'f-btn'; b.dataset.filter = tag; b.textContent = tag;
    wrap.appendChild(b);
  });
  wrap.addEventListener('click', e => {
    const btn = e.target.closest('.f-btn'); if (!btn) return;
    wrap.querySelectorAll('.f-btn').forEach(x => x.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    renderGrid(getFiltered());
  });
}

function getFiltered() {
  return ALL.filter(b => {
    const tag = activeFilter === 'all' || b.tag === activeFilter;
    const q = searchQ.toLowerCase();
    const search = !q || b.title.toLowerCase().includes(q) ||
      b.tag.toLowerCase().includes(q) || b.excerpt.toLowerCase().includes(q) ||
      b.chapters.some(c => c.title.toLowerCase().includes(q) || c.content.toLowerCase().includes(q));
    return tag && search;
  });
}

document.getElementById('search').addEventListener('input', function(){
  searchQ = this.value; renderGrid(getFiltered());
});

/* ─── RENDER GRID ────────────────────────────────────────── */
function renderGrid(list) {
  const grid = document.getElementById('grid');
  const empty = document.getElementById('empty');
  grid.innerHTML = '';
  empty.style.display = list.length ? 'none' : 'block';
  list.forEach((book, i) => {
    const el = document.createElement('article');
    el.className = 'book-card';
    el.tabIndex = 0;
    el.setAttribute('role','button');
    el.setAttribute('aria-label','Open ' + book.title);
    el.innerHTML = `
      <div class="book-cover">
        <div class="book-img">
          <img src="${book.image}" alt="${book.title}" loading="lazy"
               onerror="this.parentElement.style.background='var(--surface)'"/>
          <div class="book-img-ov"></div>
        </div>
        <div class="book-num">${String(book.id).padStart(2,'0')}</div>
        <div class="book-body">
          <p class="book-tag">${book.tag}</p>
          <h2 class="book-title">${book.title}</h2>
          <p class="book-excerpt">${book.excerpt}</p>
          <p class="book-ch-count"><span>${book.chapters.length}</span> chapters · ${book.updated}</p>
          <div class="book-foot">
            <span class="book-meta">${book.updated}</span>
            <span class="book-cta">Open Book</span>
          </div>
        </div>
      </div>`;
    el.addEventListener('click', () => openBook(book));
    el.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();openBook(book);} });
    grid.appendChild(el);
    setTimeout(() => el.classList.add('visible'), 60 + i * 80);
  });
}

/* ─── OPEN BOOK ──────────────────────────────────────────── */
function openBook(book, startIdx = 0) {
  current = book; chIdx = startIdx;

  // Populate left page
  const img = document.getElementById('leftImg');
  img.src = book.image; img.style.display = '';
  document.getElementById('leftTag').textContent = book.tag;
  document.getElementById('leftTitle').textContent = book.title;
  document.getElementById('leftMeta').innerHTML =
    `<p>Chapters <span>${book.chapters.length}</span></p><p>Updated <span>${book.updated}</span></p>`;

  // PDF links
  const pdfHref = book.pdf || '#';
  document.getElementById('pdfBtn').href = pdfHref;
  document.getElementById('pdfTopBtn').href = pdfHref;

  buildChapterList(book);

  document.getElementById('modal').classList.add('open');
  document.body.style.overflow = 'hidden';
  renderChapter(chIdx);
}

/* ─── CHAPTER SIDEBAR ────────────────────────────────────── */
function buildChapterList(book) {
  const list = document.getElementById('chapterList');
  list.innerHTML = '';
  book.chapters.forEach((ch, i) => {
    const item = document.createElement('div');
    item.className = 'ch-item' + (i === chIdx ? ' active' : '');
    item.innerHTML =
      `<span class="ch-num">${String(i+1).padStart(2,'0')}</span>` +
      `<span class="ch-name">${ch.title}</span>`;
    item.addEventListener('click', () => { chIdx = i; renderChapter(i); });
    list.appendChild(item);
  });
}

/* ─── RENDER CHAPTER ─────────────────────────────────────── */
function renderChapter(idx) {
  const book = current;
  const ch = book.chapters[idx];
  chIdx = idx;

  // Highlight active chapter in sidebar
  document.querySelectorAll('.ch-item').forEach((el, i) =>
    el.classList.toggle('active', i === idx)
  );
  // Scroll sidebar item into view
  const active = document.querySelectorAll('.ch-item')[idx];
  if (active) active.scrollIntoView({block:'nearest', inline:'nearest', behavior:'smooth'});

  // Header title
  document.getElementById('rightTitle').textContent = ch.title;

  // ★ Inject content and RESET SCROLL to top
  const content = document.getElementById('rightContent');
  content.innerHTML = ch.content;
  content.scrollTop = 0;

  // Prev / Next
  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === book.chapters.length - 1;
  document.getElementById('chNavInfo').textContent = `${idx + 1} of ${book.chapters.length}`;
}

/* ─── CLOSE ──────────────────────────────────────────────── */
function closeBook() {
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow = '';
  current = null;
}

document.getElementById('closeBtn').addEventListener('click', closeBook);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target === document.getElementById('modal')) closeBook();
});
document.addEventListener('keydown', e => {
  if (!current) return;
  if (e.key === 'Escape') { closeBook(); return; }
  if (e.key === 'ArrowRight' && chIdx < current.chapters.length - 1) renderChapter(chIdx + 1);
  if (e.key === 'ArrowLeft' && chIdx > 0) renderChapter(chIdx - 1);
});
document.getElementById('prevBtn').addEventListener('click', () => {
  if (chIdx > 0) renderChapter(chIdx - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  if (current && chIdx < current.chapters.length - 1) renderChapter(chIdx + 1);
});

loadBooks();
</script>
</body>
</html>
