<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - KarasuBerry</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    /* Reuse your existing CSS vars and styles, add admin-specific */
    body { background: var(--bg); color: var(--text); font-family: var(--ff-body); }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; padding: 2rem; }
    @media (max-width: 768px) { .admin-grid { grid-template-columns: 1fr; } }
    canvas { max-width: 100%; height: auto; }
    form { display: flex; flex-direction: column; gap: 1rem; }
    input, textarea, button { padding: 0.5rem; border: 1px solid var(--border); background: var(--card); color: var(--white); }
    button { background: var(--red); cursor: pointer; }
    .banned-users { list-style: none; }
    .live-users { font-size: 1.5rem; color: var(--gold); }
  </style>
</head>
<body>
  <nav><!-- Your navbar with DailyUpdates link --></nav>
  <div class="container admin-grid">
    <div>
      <h2>Edit Content</h2>
      <form id="contentForm">
        <select id="type"><option value="project">Projects</option><option value="edit">Edits</option><option value="gallery">Gallery</option><option value="study">StudyArea</option><option value="update">DailyUpdates</option></select>
        <input type="text" id="title" placeholder="Title">
        <textarea id="desc" placeholder="Description"></textarea>
        <input type="file" id="file">
        <button type="submit">Save</button>
      </form>
      <ul id="bannedUsers"></ul>
      <button onclick="banUser()">Ban User</button>
    </div>
    <div>
      <h2>Analytics</h2>
      <canvas id="chart"></canvas>
      <div class="live-users" id="liveCount">Live: 0</div>
      <p>Total Users: <span id="totalUsers">0</span></p>
    </div>
  </div>
  <script>
    // Fetch token from localStorage (after login)
    const token = localStorage.getItem('token');
    if (!token) window.location = '/login.html';

    // Load content
    async function loadContent(type) {
      const res = await fetch(`/api/content/${type}`, { headers: { Authorization: `Bearer ${token}` } });
      const data = await res.json();
      // Render list...
    }

    // Save content
    document.getElementById('contentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('type', document.getElementById('type').value);
      formData.append('title', document.getElementById('title').value);
      formData.append('desc', document.getElementById('desc').value);
      formData.append('file', document.getElementById('file').files[0]);
      await fetch('/api/content/' + formData.get('type'), { method: 'POST', body: formData, headers: { Authorization: `Bearer ${token}` } });
    });

    // Analytics chart
    const ctx = document.getElementById('chart').getContext('2d');
    const chart = new Chart(ctx, { type: 'line', data: { labels: ['Jan', 'Feb'], datasets: [{ label: 'Visits', data: [12, 19] }] } });  // Fetch real data from /api/analytics

    // Live users poll
    setInterval(async () => {
      const res = await fetch('/api/analytics/live', { headers: { Authorization: `Bearer ${token}` } });
      document.getElementById('liveCount').textContent = `Live: ${await res.text()}`;
    }, 5000);

    // Ban user
    async function banUser(userId) {
      await fetch('/api/admin/ban', { method: 'POST', body: JSON.stringify({ userId }), headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` } });
    }

    // Load banned
    async function loadBanned() {
      const res = await fetch('/api/admin/banned', { headers: { Authorization: `Bearer ${token}` } });
      const users = await res.json();
      document.getElementById('bannedUsers').innerHTML = users.map(u => `<li>${u.username} <button onclick="unban(${u.id})">Unban</button></li>`).join('');
    }
  </script>
</body>
</html>
