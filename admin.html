<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>KarasuBerry Admin</title>

<style>

body{
margin:0;
font-family:Outfit,system-ui;
background:#080006;
color:#eee;
}

/* layout */

.admin{
display:grid;
grid-template-columns:240px 1fr;
height:100vh;
}

/* sidebar */

.sidebar{
background:#120008;
padding:20px;
border-right:1px solid rgba(255,255,255,.08);
}

.sidebar h2{
margin-bottom:20px;
color:#fff;
}

.sidebar button{
display:block;
width:100%;
margin-bottom:10px;
padding:12px;
border:none;
background:#c8141e;
color:white;
cursor:pointer;
border-radius:4px;
}

.sidebar button:hover{
background:#e8303a;
}

/* main */

main{
padding:40px;
overflow:auto;
}

/* sections */

section{
display:none;
}

section.active{
display:block;
}

input,textarea{
width:100%;
margin-bottom:10px;
padding:10px;
border-radius:4px;
border:1px solid rgba(255,255,255,.1);
background:#16000c;
color:white;
}

textarea{
height:80px;
}

button.action{
padding:10px 18px;
background:#c8141e;
border:none;
cursor:pointer;
border-radius:4px;
color:white;
}

button.action:hover{
background:#e8303a;
}

/* cards */

.list{
margin-top:20px;
display:grid;
gap:10px;
}

.card{
padding:12px;
background:#16000c;
border:1px solid rgba(255,255,255,.08);
border-radius:4px;
}

/* mobile */

@media(max-width:700px){

.admin{
grid-template-columns:1fr;
}

.sidebar{
display:flex;
gap:10px;
overflow:auto;
}

.sidebar button{
flex:1;
}

}
  #chatMessages{
height:300px;
overflow:auto;
border:1px solid rgba(255,255,255,.1);
padding:10px;
margin-bottom:10px;
background:#120008;
}

.msg{
padding:6px;
border-bottom:1px solid rgba(255,255,255,.06);
font-size:14px;
}

</style>

</head>

<body>

<div class="admin">

<!-- sidebar -->

<aside class="sidebar">

<h2>Admin</h2>

<button onclick="show('projects')">Projects</button> <button onclick="show('chat')">Chat</button> <button onclick="show('study')">Study Area</button> <button onclick="show('updates')">Daily Updates</button> <button onclick="logout()">Logout</button>

</aside>

<!-- main -->

<main>

<!-- projects -->

<section id="projects" class="active">

<h2>Add Project</h2>

<input id="ptitle" placeholder="Project Title">
<input id="pimg" placeholder="Image URL">
<input id="purl" placeholder="Project Link">

<textarea id="pdesc" placeholder="Description"></textarea>

<button class="action" onclick="addProject()">Add Project</button>v

<div class="list" id="projectList"></div>

</section>

<!-- study -->

<section id="study">

<h2>Add Study PDF</h2>

<input id="stitle" placeholder="PDF Title">
<input id="spdf" placeholder="PDF URL">

<button class="action" onclick="addStudy()">Upload</button>

<div class="list" id="studyList"></div>

</section>

<!-- updates -->

<section id="updates">

<h2>Daily Update</h2>

<input id="utitle" placeholder="Title">

<textarea id="ucontent" placeholder="Update text"></textarea>

<button class="action" onclick="addUpdate()">Publish</button>

<div class="list" id="updateList"></div>

</section> 
  <section id="chat">

<h2>Public Chat</h2>

<div id="chatMessages"></div>

<input id="chatInput" placeholder="Reply as admin">
<button onclick="sendAdminMsg()">Send</button>

</section>

</main>

</div>

<script>

/* auth check */

const token=localStorage.getItem("token")

if(!token){

alert("Login required")
location.href="/login.html"

}

/* navigation */

function show(id){

document.querySelectorAll("section")
.forEach(s=>s.classList.remove("active"))

document.getElementById(id).classList.add("active")

}

/* add project */

async function addProject(){

const title=document.getElementById("ptitle").value
const description=document.getElementById("pdesc").value
const image=document.getElementById("pimg").value
const url=document.getElementById("purl").value

await fetch("/api/admin/add-project",{

method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},

body:JSON.stringify({
title,
description,
image,
url
})

})

alert("Project added")

}

/* add study */

async function addStudy(){

const title=document.getElementById("stitle").value
const pdf=document.getElementById("spdf").value

await fetch("/api/admin/add-study",{

method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},

body:JSON.stringify({
title,
pdf_url:pdf
})

})

alert("PDF added")

}

/* add update */

async function addUpdate(){

const title=document.getElementById("utitle").value
const content=document.getElementById("ucontent").value

await fetch("/api/admin/add-update",{

method:"POST",

headers:{
"Content-Type":"application/json",
Authorization:"Bearer "+token
},

body:JSON.stringify({
title,
content
})

})

alert("Update published")

}

/* logout */

function logout(){

localStorage.removeItem("token")

location.href="/login.html"

}

</script>

</body>
</html>
