<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin - KarasuBerry</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root{--bg:#080006;--card:#16000c;--border:rgba(255,255,255,0.07);--red:#c8141e;--white:#f5eeea;--text:#b8a8ad;--ff-display:'Bebas Neue',sans-serif;--ff-body:'Outfit',sans-serif;--ff-mono:'JetBrains Mono',monospace}
    body{background:var(--bg);color:var(--text);font-family:var(--ff-body);padding:2rem}
    .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:2rem}@media(max-width:768px){.admin-grid{grid-template-columns:1fr}}
    form{display:flex;flex-direction:column;gap:1rem;max-width:400px}
    input,textarea,select,button{padding:0.5rem;background:var(--card);color:var(--white);border:1px solid var(--border);border-radius:0.25rem}
    button{background:var(--red);cursor:pointer;transition:background 0.3s}
    button:hover{background:#e8303a}
    #analyticsChart{max-width:100%;height:300px}
    ul{list-style:none;padding:0}
    li{padding:0.5rem;border-bottom:1px solid var(--border)}
    .item{background:var(--card);margin:0.5rem 0;padding:1rem;border-radius:0.25rem}
  </style>
</head>
<body>
  <h1>Admin Dashboard</h1>
  <div class="admin-grid">
    <div>
      <h2>Add Content</h2>
      <form id="contentForm">
        <select id="type">
          <option value="project">Project</option>
          <option value="edit">Edit</option>
          <option value="gallery">Gallery</option>
          <option value="study">Study Note</option>
          <option value="update">Update</option>
        </select>
        <input type="text" id="title" placeholder="Title" required>
        <textarea id="desc" placeholder="Description"></textarea>
        <input type="file" id="file">
        <input type="url" id="videoUrl" placeholder="Video URL (optional)">
        <button type="submit">Add</button>
      </form>
      <h3>Projects</h3>
      <div id="projectsList"></div>
      <h3>Banned Users</h3>
      <ul id="bannedList"></ul>
      <button onclick="loadBanned()">Refresh Banned</button>
    </div>
    <div>
      <h2>Analytics</h2>
      <canvas id="analyticsChart"></canvas>
      <p id="liveUsers">Live: Loading...</p>
      <p>Total Users: <span id="totalUsers">Loading...</span></p>
    </div>
  </div>
  <script type="module">
    import { apiCall } from './api.js';
    // Paste full admin.js code here (loadContent, deleteItem, loadBanned, banUser, poll)
    document.getElementById('contentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('type', document.getElementById('type').value);
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('desc').value);
      const file = document.getElementById('file').files[0];
      if (file) formData.append('file', file);
      const videoUrl = document.getElementById('videoUrl').value;
      if (videoUrl) formData.append('videoUrl', videoUrl);

      try {
        await fetch('/api/content', { method: 'POST', body: formData });
        alert('Added!');
        e.target.reset();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });
  </script>
</body>
</html>
